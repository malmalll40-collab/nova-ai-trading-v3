name: NOVA forward runner integration
on:
  pull_request:
    branches: [main]
    paths:
      - forward_shadow/**
      - integration_checks/forward_runner_postgres.py
      - .github/workflows/forward-runner-integration.yml
      - server.py
permissions:
  contents: read
jobs:
  isolated-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nova_ci
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: nova_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova_ci -d nova_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: "."
      NOVA_TEST_POSTGRES_DSN: postgresql://nova_ci:local_ci_only@127.0.0.1:5432/nova_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt httpx
      - name: Verify exact frozen strategy hash
        run: echo "55faf64cc2f02175b3fc0c424f75d1211e504d35264dfae9d7092af81cbdd6f6  forward_shadow/forward.py" | sha256sum -c -
      - run: python integration_checks/forward_runner_postgres.py
      - run: python integration_checks/forward_scheduler_postgres.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check static/forward_shadow.js && node --check static/sw.js
      - run: python integration_checks/history_archive_postgres.py
