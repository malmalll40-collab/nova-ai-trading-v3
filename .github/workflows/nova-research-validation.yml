name: NOVA research validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      NOVA_OPS_DIAGNOSTICS_ON_START: "0"
      NOVA_CORE541_EVIDENCE_ENABLED: "0"
      NOVA_CORE560_AUTO_ENABLED: "0"
      NOVA_CORE566_AUTO_ENABLED: "0"
      NOVA_AUTOTRACK_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx pytest-timeout pytest-socket
      - name: Compile sources
        run: python -m compileall -q -x '/\.git/' .
      - name: Focused research tests
        run: python -m pytest -vv --timeout=45 --timeout-method=signal --disable-socket --allow-unix-socket tests/test_v571_policy.py
      - name: Regression tests
        run: |
          python -m pytest --collect-only -q > /tmp/nova-test-collection.txt
          tail -n 2 /tmp/nova-test-collection.txt
          python -m pytest -vv --durations=20 --timeout=45 --timeout-method=signal --disable-socket --allow-unix-socket --junitxml=/tmp/nova-regression.xml
      - name: Verify complete test count
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/nova-regression.xml').getroot()
          cases = list(root.iter('testcase'))
          assert len(cases) == 743, f'Expected 743 cases, got {len(cases)}'
          assert not any(c.find(k) is not None for c in cases for k in ('failure','error','skipped'))
          print('All 743 regression cases passed without skips')
          PY
      - name: Verify Render archive overlay
        if: always()
        run: |
          python - <<'PY'
          import hashlib, pathlib, stat, subprocess, zipfile
          root = pathlib.Path('.')
          archives = list(root.glob('*.zip'))
          print('Root archive count:', len(archives))
          assert len(archives) == 1, 'Render extraction requires exactly one root ZIP'
          tracked = set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))
          required = {'server.py','requirements.txt','nova_v570_accuracy.py','nova_v571_policy.py','nova_v542_aligned.py','ops_diagnostics.py'}
          assert required <= tracked, 'Required research source not tracked'
          with zipfile.ZipFile(archives[0]) as z:
              names = set()
              conflicts = []
              for info in z.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename
                  assert not stat.S_ISLNK(info.external_attr >> 16)
                  if info.is_dir(): continue
                  name = str(p)
                  assert name not in names, f'Duplicate archive entry: {name}'
                  names.add(name)
                  if name in tracked and (not (root/name).is_file() or hashlib.sha256(z.read(info)).digest() != hashlib.sha256((root/name).read_bytes()).digest()):
                      conflicts.append(name)
              print('Archive/tracked collisions with different bytes:', conflicts)
              assert not conflicts, 'Render archive would overwrite tracked sources'
              for name in sorted(required):
                  print(name, hashlib.sha256((root/name).read_bytes()).hexdigest(), 'archive-identical' if name in names else 'checkout-only')
          PY
