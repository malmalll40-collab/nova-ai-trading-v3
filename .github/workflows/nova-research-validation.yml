name: NOVA research validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      NOVA_OPS_DIAGNOSTICS_ON_START: "0"
      NOVA_CORE541_EVIDENCE_ENABLED: "0"
      NOVA_CORE560_AUTO_ENABLED: "0"
      NOVA_CORE566_AUTO_ENABLED: "0"
      NOVA_AUTOTRACK_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx pytest-timeout pytest-socket
      - name: Compile sources
        run: python -m compileall -q -x '/\.git/' .
      - name: Focused research tests
        run: python -m pytest -vv --timeout=45 --timeout-method=signal --disable-socket --allow-unix-socket tests/test_v571_policy.py tests/test_v572_calibration.py tests/test_v573_ml.py tests/test_v574_data_audit.py tests/test_v575_calendar_coverage.py tests/test_cache_key_deadlock.py tests/test_v576_expanded_coverage.py tests/test_v577_split_coverage.py tests/test_v578_kis_telemetry.py tests/test_v579_admission.py tests/test_v580_integrated.py tests/test_v582_signal_pattern.py tests/test_v583_pattern_replay.py tests/test_v584_pattern_scan.py tests/test_v586_release.py tests/test_v588_scan_efficiency.py tests/test_v589_independent_scans.py tests/test_v590_poll_isolation.py tests/test_v591_queue_diagnostics.py tests/test_v592_asof_integrity.py tests/test_v593_scan_cache.py tests/test_v600_workspace.py tests/test_ops_preflight.py tests/test_research_history_checkpoint.py tests/test_research_history_resume.py tests/test_research_history_status.py tests/test_research_history_execution.py tests/test_research_calendar_lock.py tests/test_kis_ws_telemetry.py tests/test_v601_frozen_holdout.py tests/test_research_db_endpoint.py tests/test_research_db_session_probe.py tests/test_research_kis_transport_gate.py tests/test_research_history_pipeline.py tests/test_research_operational_activation.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate signal pattern UI
        run: |
          node --check static/pattern_research.js
          node --check static/recommendations.js
          node --check static/sw.js
          node --check static/candles.js
          node --check static/app.js
          node --check static/v5_dashboard.js
          node --test tests/test_v585_pattern_ui.cjs tests/test_v586_pattern_menu.cjs tests/test_v591_chart_overlay.cjs tests/test_v601_scan_interruption.cjs
      - name: Regression tests
        run: |
          python -m pytest --collect-only -q > /tmp/nova-test-collection.txt
          tail -n 2 /tmp/nova-test-collection.txt
          python -m pytest -vv --durations=20 --timeout=45 --timeout-method=signal --disable-socket --allow-unix-socket --junitxml=/tmp/nova-regression.xml
      - name: Verify complete test count
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/nova-regression.xml').getroot()
          cases = list(root.iter('testcase'))
          assert len(cases) == 997, f'Expected 997 cases, got {len(cases)}'
          assert not any(c.find(k) is not None for c in cases for k in ('failure','error','skipped'))
          print('All 997 regression cases passed without skips')
          PY
      - name: Verify Render archive overlay
        if: always()
        run: |
          python - <<'PY'
          import hashlib, pathlib, stat, subprocess, zipfile
          root = pathlib.Path('.')
          archives = list(root.glob('*.zip'))
          print('Root archive count:', len(archives))
          assert len(archives) == 1, 'Render extraction requires exactly one root ZIP'
          tracked = set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))
          required = {'server.py','nova_release.py','nova_v588_scan_projection.py','nova_v593_scan_cache.py','requirements.txt','nova_v570_accuracy.py','nova_v571_policy.py','nova_v572_calibration.py','nova_v573_ml.py','nova_v574_data_audit.py','nova_v575_calendar_coverage.py','nova_v576_expanded_coverage.py','nova_v577_split_coverage.py','nova_v578_kis_telemetry.py','nova_v579_admission.py','nova_v580_integrated.py','nova_v582_signal_pattern.py','nova_v583_pattern_replay.py','nova_v584_pattern_scan.py','static/pattern_research.js','static/recommendations.js','static/candles.js','static/index.html','static/sw.js','market_scanner.py','data_sources.py','nova_v541_core.py','nova_v542_aligned.py','ops_diagnostics.py','ops_preflight.py','research_history_checkpoint.py','research_history_resume.py','research_history_postgres.py','research_history_run_control.py','research_history_status.py','research_history_execution.py','research_db_endpoint.py','research_db_session_probe.py','research_kis_shared_quota.py','research_kis_transport_gate.py','research_history_pipeline.py','research_operational_activation.py','integration_checks/history_postgres.py'}
          assert required <= tracked, 'Required research source not tracked'
          with zipfile.ZipFile(archives[0]) as z:
              names = set()
              conflicts = []
              for info in z.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename
                  assert not stat.S_ISLNK(info.external_attr >> 16)
                  if info.is_dir(): continue
                  name = str(p)
                  assert name not in names, f'Duplicate archive entry: {name}'
                  names.add(name)
                  if name in tracked and (not (root/name).is_file() or hashlib.sha256(z.read(info)).digest() != hashlib.sha256((root/name).read_bytes()).digest()):
                      conflicts.append(name)
              print('Archive/tracked collisions with different bytes:', conflicts)
              assert not conflicts, 'Render archive would overwrite tracked sources'
              for name in sorted(required):
                  print(name, hashlib.sha256((root/name).read_bytes()).hexdigest(), 'archive-identical' if name in names else 'checkout-only')
          PY
  postgres-history-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nova_ci
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: nova_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova_ci -d nova_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: "."
      NOVA_TEST_POSTGRES_DSN: postgresql://nova_ci:local_ci_only@127.0.0.1:5432/nova_ci
      NOVA_OPS_DIAGNOSTICS_ON_START: "0"
      NOVA_CORE541_EVIDENCE_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify PostgreSQL history transactions
        run: python integration_checks/history_postgres.py
