name: NOVA v5.6.1 daily research (no orders)
on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 1-5'
permissions:
  contents: read
concurrency:
  group: nova-core560-observation
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOVA_AUTOTRACK_TOKEN: ${{ secrets.NOVA_AUTOTRACK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/nova_core560_ping.py
