services:
  - type: web
    name: nova-trading-mobile-v4-4
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NOVA_PUBLIC_DEPLOY
        value: '1'
      - key: NOVA_ACCESS_TOKEN
        sync: false
      - key: OPENDART_API_KEY
        sync: false
      - key: KRX_API_KEY
        sync: false
      - key: FSC_STOCK_API_KEY
        sync: false
      - key: KIS_APP_KEY
        sync: false
      - key: KIS_APP_SECRET
        sync: false
